components:
  comp_api:
    mode: local
    test_command: cd services/api && pnpm test && pnpm run test:e2e
    build_command: cd services/api && pnpm run build
    devloop_command: cd services/api && pnpm run typecheck && pnpm test
  comp_web_app:
    mode: local
    test_command: cd apps/web && pnpm test
    build_command: cd apps/web && pnpm build
    devloop_command: cd apps/web && pnpm devloop
  comp_worker:
    mode: local
    test_command: cd services/worker && pnpm test
    build_command: cd services/worker && pnpm run build
    devloop_command: cd services/worker && pnpm run typecheck
commands:
  test: (cd services/api && pnpm test && pnpm run test:e2e) && (cd apps/web && pnpm
    test) && (cd services/worker && pnpm test)
  build: (cd services/api && pnpm run build) && (cd apps/web && pnpm build) && (cd
    services/worker && pnpm run build)
  devloop: (cd services/api && pnpm run typecheck && pnpm test) && (cd apps/web &&
    pnpm devloop) && (cd services/worker && pnpm run typecheck)
